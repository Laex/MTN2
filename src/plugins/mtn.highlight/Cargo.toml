[package]
name = "mtn_highlight"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
codegen-units = 1
