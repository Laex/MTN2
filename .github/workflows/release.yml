name: Release

# Push a tag like v0.3.0 to build, test and publish a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose release has not been published yet
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, windows, delphi]
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Changelog
        shell: pwsh
        # This version's CHANGELOG.md section becomes the release page's "what's
        # new"; fails early when the tag has none (changelog.ps1 -Stamp first).
        run: ./src/tools/changelog.ps1 -Section $env:TAG -OutFile "$env:RUNNER_TEMP/changes.md"

      - name: Build
        shell: pwsh
        # The tag becomes the exe's version resource (what the updater compares).
        run: ./src/build.ps1 -Config Release -Platform Win64 -Version $env:TAG

      - name: Tests
        shell: pwsh
        run: ./src/tests/run-tests.ps1

      - name: Package
        shell: pwsh
        # Regular and portable zip (the updater only ever takes the regular one).
        run: ./src/tools/package-release.ps1 -Version $env:TAG -RequireWasmtime

      - name: Check packages
        shell: pwsh
        # Unzips each package into a clean folder and runs MTN2.exe --self-check.
        run: ./src/tools/check-release.ps1 -Version $env:TAG

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Zips = @(Get-ChildItem dist -Filter *.zip | ForEach-Object FullName)
          if ($Zips.Count -ne 2) { throw "expected 2 packages in dist, found $($Zips.Count)" }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Releases are immutable (repo setting): a published zip can't be
            # replaced, since the updater trusts its SHA-256 digest. Ship a new tag.
            throw "Release $env:TAG is already published and immutable; tag a new version"
          } else {
            # What's new (the tag's CHANGELOG.md section, with a link to the
            # whole file), then the install/7z.dll notes
            # (.github/release-notes.md, {{TAG}} = the tag), then GitHub's
            # generated compare link.
            $Notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            (Get-Content (Join-Path $env:RUNNER_TEMP 'changes.md') -Raw -Encoding utf8) +
              (Get-Content .github/release-notes.md -Raw -Encoding utf8).Replace('{{TAG}}', $env:TAG) |
              Set-Content $Notes -Encoding utf8NoBOM
            gh release create $env:TAG @Zips --title "MTN2 $env:TAG" `
              --notes-file $Notes --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed: $LASTEXITCODE" }
