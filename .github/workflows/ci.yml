name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on GitHub-hosted runners: no RAD Studio needed.
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate JSON resources
        # Dialog/string resources are saved with a UTF-8 BOM by the IDE.
        run: |
          git ls-files -z '*.json' | xargs -0 python3 -c '
          import json, sys
          for f in sys.argv[1:]:
              json.load(open(f, encoding="utf-8-sig"))
          print(f"OK: {len(sys.argv) - 1} JSON files")
          '

  wasm-plugin:
    name: mtn.ws (Rust -> wasm32)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/plugins/mtn.ws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned by SHA, so the toolchain can't come from the ref name.
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/plugins/mtn.ws
      - run: cargo build --locked --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mtn.ws-plugin.wasm
          path: src/plugins/mtn.ws/target/wasm32-unknown-unknown/release/mtn_ws.wasm

  # RAD Studio is commercial and absent from hosted runners, so the Delphi
  # build runs on a self-hosted runner labelled `delphi` (see docs/BUILDING.md).
  # Enabled by the repository variable DELPHI_RUNNER=true; never runs for
  # pull requests from forks (untrusted code on the maintainer's machine).
  delphi:
    name: Delphi build + tests (Win64)
    if: >-
      vars.DELPHI_RUNNER == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, delphi]
    timeout-minutes: 60
    env:
      DEV_REPO: Laex/MTN2-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Dev version
        # A push to main is also published as a development build of
        # Laex/MTN2-dev (see src/tools/dev-version.ps1 for the numbering).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $Version = ./src/tools/dev-version.ps1
          if (-not $Version) { throw 'dev-version.ps1 printed nothing' }
          "DEV_VERSION=$Version" | Add-Content $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          if ($env:DEV_VERSION) { ./src/build.ps1 -Config Release -Platform Win64 -Version $env:DEV_VERSION }
          else { ./src/build.ps1 -Config Release -Platform Win64 }

      - name: Tests
        shell: pwsh
        run: ./src/tests/run-tests.ps1

      - name: Test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports
          path: |
            src/tests/dcu/*Tests.xml
            src/tests/dcu/*Tests.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package
        shell: pwsh
        run: ./src/tools/package-release.ps1 -Version ($env:DEV_VERSION ?? "ci-${{ github.sha }}")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MTN2-win64
          path: dist/*.zip
          retention-days: 14

      - name: Check packages
        if: env.DEV_VERSION != ''
        shell: pwsh
        run: ./src/tools/check-release.ps1 -Version $env:DEV_VERSION

      - name: Publish dev release
        if: env.DEV_VERSION != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DEV_RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'secret DEV_RELEASE_TOKEN is not set' }
          $Zips = @(Get-ChildItem dist -Filter *.zip | ForEach-Object FullName)
          if ($Zips.Count -ne 2) { throw "expected 2 packages in dist, found $($Zips.Count)" }

          # A release needs a commit to tag: seed an empty repository.
          if ([int](gh api "repos/$env:DEV_REPO/branches" --jq length) -eq 0) {
            $Readme = "# MTN2 development builds`n`nRolling prerelease built from every push to https://github.com/Laex/MTN2. Enable it in MTN2: Help > Updates > Update from the dev channel.`n"
            $B64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($Readme))
            gh api -X PUT "repos/$env:DEV_REPO/contents/README.md" -f message='Add README' -f content=$B64 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "seeding $env:DEV_REPO failed: $LASTEXITCODE" }
          }

          $Notes = "Development build $env:DEV_VERSION of ${{ github.sha }}.`nNot a release: may be unstable."
          gh release view dev --repo $env:DEV_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev --repo $env:DEV_REPO --prerelease --latest=false `
              --title 'MTN2 dev' --notes $Notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
          } else {
            gh release edit dev --repo $env:DEV_REPO --prerelease --latest=false --notes $Notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed: $LASTEXITCODE" }
          }

          # Upload first, then drop the previous build's packages, so the
          # updater never finds the release without a package for long.
          gh release upload dev @Zips --repo $env:DEV_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed: $LASTEXITCODE" }
          $Keep = $Zips | ForEach-Object { Split-Path $_ -Leaf }
          foreach ($Old in (gh release view dev --repo $env:DEV_REPO --json assets --jq '.assets[].name')) {
            if ($Old -and ($Keep -notcontains $Old)) {
              gh release delete-asset dev $Old --repo $env:DEV_REPO --yes
            }
          }
